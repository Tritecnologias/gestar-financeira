server {
    listen 80;
    server_name dezsolucoes.com.br www.dezsolucoes.com.br;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionar HTTP → HTTPS (ativar após gerar certificado)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dezsolucoes.com.br www.dezsolucoes.com.br;

    ssl_certificate     /etc/letsencrypt/live/dezsolucoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dezsolucoes.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy para o Next.js
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cookie_path  / "/; Secure; SameSite=Lax";
    }

    # Cache de assets estáticos
    location /_next/static/ {
        proxy_pass http://app:3000/_next/static/;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}

# Homologacao 10S: hostname e certificado exclusivos.
server {
    listen 80;
    server_name homolog.dezsolucoes.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name homolog.dezsolucoes.com.br;

    ssl_certificate     /etc/letsencrypt/live/homolog.dezsolucoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog.dezsolucoes.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $homolog_upstream gestar-homolog-app;

    location / {
        proxy_pass http://$homolog_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}

# Apenas o endereco temporario antigo da HOMO: impedir fallback na producao.
server {
    listen 80;
    server_name ~^aeij7divhlbom3taovbdegbh[.]187[.]77[.]202[.]129[.]sslip[.]io$;
    return 410;
}

server {
    listen 443 ssl http2;
    server_name ~^aeij7divhlbom3taovbdegbh[.]187[.]77[.]202[.]129[.]sslip[.]io$;
    ssl_reject_handshake on;
