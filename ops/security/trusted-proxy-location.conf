# PROPOSAL ONLY. Include inside the exclusive HOMO location / after review.
# The app port must not be published to the Internet. Do not enable real_ip_header
# from arbitrary peers: $remote_addr must be the socket peer of this edge.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;
# Private file (not Git): proxy_set_header X-10S-Proxy-Token "<64 random hex>";
# Match TRUSTED_PROXY_TOKEN in this application's private runtime environment.
include /etc/nginx/private/10s-homolog-proxy-token.conf;
