# LOCAL PG18 only. Never apply to the old production/HOMOLOG compose project.
# A new volume is mandatory; PG16 data directories are not compatible.
name: dez-local-pg18
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: pg18_local_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required; configure a private secret}
      POSTGRES_DB: gestar_local_pg18
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg18_local_admin -d gestar_local_pg18"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: [app]
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?SOURCE_COMMIT must be the exact clean checkout SHA}
        SOURCE_BRANCH: ${SOURCE_BRANCH:-compat/pg18-clean-baseline}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LOCAL_RUNTIME_DATABASE_URL:?Provision the PG18 local runtime first; never use admin}
      NEXTAUTH_URL: http://localhost:3008
      APP_PUBLIC_URL: http://localhost:3008
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required; configure a private secret}
      ACCESS_AUTH_MODE: identity
      TENANT_BACKUP_INSTANCE_ID: ${LOCAL_BACKUP_INSTANCE_ID:?Use a new local instance ID}
      TENANT_BACKUP_SIGNING_KEY_ID: ${LOCAL_BACKUP_KEY_ID:?Use a new local signing key ID}
      TENANT_BACKUP_SIGNING_KEYS: ${LOCAL_BACKUP_KEYS:?Use a new private local HMAC keyring}
      TERM_STORAGE_DIR: /var/lib/10s/terms
      TENANT_BACKUP_DIR: /var/lib/10s/backups
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3008:3000"
    volumes:
      - terms_pg18_data:/var/lib/10s/terms
      - backups_pg18_data:/var/lib/10s/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_pg18_data:
  terms_pg18_data:
  backups_pg18_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${LOCAL_PG18_SUBNET:-10.233.19.0/24}
